apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend-goapp-container
        image: amrelhady388/go-app-project:backend-go-app
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: secret-volume
          mountPath: "/run/secrets/db-password"
          subPath: db-password
      volumes:
      - name: secret-volume
        secret:
          secretName: backend-secret
